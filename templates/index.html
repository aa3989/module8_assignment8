<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1222">
  <title>Hello World & Calculator Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1120;
      --panel: #131e32;
      --line: #2a3a54;
      --muted: #a4b4ce;
      --text: #f3f7ff;
      --accent: #7c9dff;
      --accent-deep: #4168e6;
      --error: #ff8c9b;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 34px 18px;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at 16% 11%, #203766 0, transparent 40%),
                  radial-gradient(ellipse at 86% 88%, #182956 0, transparent 36%), var(--bg);
    }
    main { width: min(100%, 520px); }
    .eyebrow {
      margin: 0 0 18px;
      color: #c2d0ee;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .calculator {
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid #334768;
      border-radius: 26px;
      background: linear-gradient(155deg, #1a2944, var(--panel) 62%);
      box-shadow: 0 28px 85px #02071385, inset 0 1px #ffffff11;
    }
    .header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .mark {
      display: grid; place-items: center; flex: 0 0 50px; height: 50px;
      border-radius: 16px; font-size: 29px; font-weight: 700;
      background: #7294ff22; color: #a6baff; border: 1px solid #819dff44;
    }
    h2 { margin: 0; font-size: 29px; letter-spacing: -.045em; line-height: 1.12; }
    .subtitle { margin: 14px 0 28px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: block; margin-bottom: 9px; color: #d5e0f4; font-size: 13px; font-weight: 600; }
    input {
      width: 100%; min-width: 0; border: 1px solid var(--line); outline: none;
      border-radius: 12px; background: #0c1729; color: var(--text);
      font: 500 17px/1.2 inherit; font-size: 17px; padding: 15px 13px;
      transition: border-color .18s, box-shadow .18s;
    }
    input::placeholder { color: #7386a5; font-size: 14px; }
    input:focus { border-color: #91acff; box-shadow: 0 0 0 3px #7798ff2a; }
    .section-label { margin: 26px 0 12px; font-size: 13px; color: #d5e0f4; font-weight: 600; }
    .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
    button {
      cursor: pointer; padding: 14px 12px; min-height: 53px;
      border: 1px solid #41567b; border-radius: 12px;
      background: #243551; color: #f5f8ff;
      font: inherit; font-size: 14px; font-weight: 650;
      transition: transform .15s, border-color .15s, background .15s;
    }
    button:hover { background: #31476b; border-color: #86a4ff; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #a2b7ff; outline-offset: 2px; }
    button:active { transform: translateY(0); }
    /* Highlight only the selected operation */
    button.selected {
    background: linear-gradient(135deg, #6488ff, var(--accent-deep));
    border-color: #7595ff;
    color: #ffffff;
    box-shadow: 0 0 0 2px #6488ff30;
    }

    button.selected:hover {
    background: linear-gradient(135deg, #7798ff, #4d74ed);
    }
    button:disabled { opacity: .62; cursor: wait; transform: none; }
    .output {
      margin-top: 24px; padding: 19px 20px; min-height: 92px;
      border: 1px solid #365173; border-radius: 15px; background: #0d1b31;
    }
    .output-label { margin: 0 0 8px; color: #8fa7cd; text-transform: uppercase; font-size: 11px; letter-spacing: .14em; font-weight: 800; }
    .result { min-height: 25px; font-size: 19px; font-weight: 650; line-height: 1.4; overflow-wrap: anywhere; }
    .result.placeholder { color: #8fa4c4; font-size: 15px; font-weight: 450; }
    .result.error { color: var(--error); }
    .footer { margin: 20px 0 0; color: #90a2bf; font-size: 12px; text-align: center; }
    @media (max-width: 430px) {
      .fields { grid-template-columns: 1fr; }
      h2 { font-size: 27px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <section class="calculator" aria-labelledby="calculator-heading">
      <div class="header">
        <span class="mark" aria-hidden="true">±</span>
        <h2 id="calculator-heading">Calculator</h2>
      </div>
      <p class="subtitle">A simple, powerful calculator built with FastAPI. Enter two values and choose an operation.</p>

      <div class="fields">
        <div>
          <label for="a">First number</label>
          <input type="text" inputmode="decimal" id="a" placeholder="e.g. 10" autocomplete="off">
        </div>
        <div>
          <label for="b">Second number</label>
          <input type="text" inputmode="decimal" id="b" placeholder="e.g. 5" autocomplete="off">
        </div>
      </div>

      <p class="section-label">Choose an operation</p>
        <div class="buttons">
        <button type="button" onclick="calculate('add')">Add</button>
        <button type="button" onclick="calculate('subtract')">Subtract</button>
        <button type="button" onclick="calculate('multiply')">Multiply</button>
        <button type="button" onclick="calculate('divide')">Divide</button>
        </div>

      <div class="output" aria-label="Calculation output">
        <p class="output-label">Result</p>
        <div class="result placeholder" id="result" role="status" aria-live="polite">Your answer will appear here</div>
      </div>
    </section>
    <p class="footer">FastAPI Calculator · IS601 Module 8</p>
  </main>

  <script>
    async function calculate(operation) {
      const first = document.getElementById('a').value.trim();
      const second = document.getElementById('b').value.trim();
      const resultElement = document.getElementById('result');
      const buttons = document.querySelectorAll('.buttons button');
    // Highlight the selected operation
    buttons.forEach(button => {
    button.classList.toggle(
        'selected',
        button.getAttribute('onclick') === `calculate('${operation}')`
    );
    });
      const setResult = (message, isError = false) => {
        resultElement.textContent = message;
        resultElement.classList.remove('placeholder');
        resultElement.classList.toggle('error', isError);
      };

      if (first === '' || second === '' || !Number.isFinite(Number(first)) || !Number.isFinite(Number(second))) {
        setResult('Error: Please enter two valid numbers.', true);
        return;
      }

      const a = Number(first);
      const b = Number(second);
      buttons.forEach(button => { button.disabled = true; });
      setResult('Calculating…');
      try {
        const response = await fetch('/' + operation, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ a, b })
        });
        const data = await response.json();
        if (response.ok) {
          setResult(data.result);
        } else {
          setResult('Error: ' + (data.error || data.detail || 'Unable to calculate.'), true);
        }
      } catch (e) {
        console.error('Fetch error:', e);
        setResult('Error: ' + e.message, true);
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    }
  </script>
</body>
</html>
